schema: gsuite.model/v1-draft
name: large_multiple_effects_5trait
traits:
- trait1
- trait2
- trait3
- trait4
- trait5
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/large-multiple-effects-5trait/data/phenotypes.csv
    format: csv
    id: record_id
    columns:
      individual: animal
      site: site
      family: family
      treatment: treatment
    responses:
      trait1: trait1
      trait2: trait2
      trait3: trait3
      trait4: trait4
      trait5: trait5
  pedigree:
    type: pedigree
    file: ../frozen-inputs/gsim/large-single-step-5trait/pedigree.csv
    columns:
      individual: animal
      parent1: sire
      parent2: dam
  genotypes:
    type: plink
    prefix: ../frozen-inputs/gsim/large-single-step-5trait/genotypes
    id: IID
relationships:
  A:
    type: pedigree
    input: pedigree
  H:
    type: single_step
