model:
  data: observations
  fixed: factor(treatment)
  random:
    genetic:
      group: individual
      relationship: H
      covariance: genetic
    site:
      group: site
      covariance: site
    family:
      group: family
      covariance: family
    individual_environment:
      group: individual
      covariance: individual_environment
  residual: residual
analysis:
  task: rhe
  rhe:
    method: ordinary
    probes: 32
    seed: 4401
execution:
  formulation: ss_snp
  solver: pcg
  sparse_backend: pardiso
  preconditioner: qnn_reuse
  pedigree_factorization: ancestral_sweeps
  marker_cache: packed
  budgets:
    budget_bytes: 4294967296
  convergence:
    relative_tolerance: 1.0e-12
    absolute_tolerance: 1.0e-13
    maximum_iterations: 4000
  threads: 4
output:
  directory: results/vc
  tables:
  - diagnostics
  predictions: {}
