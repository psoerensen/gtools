schema: gsuite.model/v1-draft
name: large_multiple_effects_5trait
traits:
- trait1
- trait2
- trait3
- trait4
- trait5
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/large-multiple-effects-5trait/data/phenotypes.csv
    format: csv
    id: record_id
    columns:
      individual: animal
      site: site
      family: family
      treatment: treatment
    responses:
      trait1: trait1
      trait2: trait2
      trait3: trait3
      trait4: trait4
      trait5: trait5
  pedigree:
    type: pedigree
    file: ../frozen-inputs/gsim/large-single-step-5trait/pedigree.csv
    columns:
      individual: animal
      parent1: sire
      parent2: dam
  genotypes:
    type: plink
    prefix: ../frozen-inputs/gsim/large-single-step-5trait/genotypes
    id: IID
relationships:
  A:
    type: pedigree
    input: pedigree
  H:
    type: single_step
    pedigree: A
    genotypes: genotypes
    genomic:
      adjustment: pedigree_moments
      polygenic_weight: 0.25
      independent_ridge: 0.0
covariances:
  from_fit: results/vc/run.json
model:
  data: observations
  fixed: factor(treatment)
  random:
    genetic:
      group: individual
      relationship: H
      covariance: genetic
    site:
      group: site
      covariance: site
    family:
      group: family
      covariance: family
    individual_environment:
      group: individual
      covariance: individual_environment
  residual: residual
analysis:
  task: solve
execution:
  formulation: ss_snp
  solver: pcg
  sparse_backend: pardiso
  preconditioner: qnn_reuse
  pedigree_factorization: ancestral_sweeps
  marker_cache: packed
  budgets:
    budget_bytes: 4294967296
  convergence:
    relative_tolerance: 1.0e-12
    absolute_tolerance: 1.0e-13
    maximum_iterations: 4000
  threads: 4
  data_selection: all_records
output:
  directory: results/blup
  predictions:
    genetic_values:
      effects:
      - genetic
      levels: all
evaluation:
  predictions: genetic_values
  truth:
    file: ../frozen-inputs/rhe/cases/large-multiple-effects-5trait/data/true_breeding_values.csv
    columns:
      individual: animal
      trait: trait
      value: true_breeding_value
  subset: all
  individual: individual
  genotypes: genotypes
