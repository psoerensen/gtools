schema: gsuite.model/v1-draft
name: multitrait_observation_precision
traits:
- trait1
- trait2
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/10k-multitrait-observation-precision/data/phenotypes.csv
    format: csv
    id: record_id
    columns:
      individual: sample_id
      cohort: cohort
      age: age_years
      height_precision: height_precision
      bmi_precision: bmi_precision
      sampling_scale: sampling_scale
    responses:
      trait1: height_cm
      trait2: bmi
  pedigree:
    type: pedigree
    file: ../frozen-inputs/gsim/large-single-step-5trait/pedigree.csv
    columns:
      individual: animal
      parent1: sire
      parent2: dam
relationships:
  A:
    type: pedigree
    input: pedigree
covariances:
  from_fit: results/vc/run.json
model:
  data: observations
  fixed: factor(cohort) + age
  random:
    genetic:
      group: individual
      relationship: A
      covariance: genetic
  residual:
    type: independent
    covariance: residual
    precision_weights:
      trait1: height_precision
      trait2: bmi_precision
    measurement_error:
      covariance: sampling
      scale: sampling_scale
analysis:
  task: solve
execution:
  solver: sparse_direct
  sparse_backend: pardiso
  threads: 4
output:
  directory: results/blup
  predictions:
    genetic_values:
      effects:
      - genetic
      levels: all
