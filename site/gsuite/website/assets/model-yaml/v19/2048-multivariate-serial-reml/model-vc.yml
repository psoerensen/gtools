schema: gsuite.model/v1-draft
name: multivariate_serial_reml
traits:
- trait1
- trait2
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/2048-multivariate-serial-reml/data/phenotypes.csv
    id: record_id
    columns:
      individual: sample_id
      unit: sample_id
      time: day
    responses:
      trait1: v0
      trait2: v1
covariances:
  genetic:
  - - 0.6
    - 0.1
  - - 0.1
    - 0.4
  residual:
  - - 1.0
    - 0.3
  - - 0.3
    - 0.8
model:
  data: observations
  fixed: '1'
  random:
    genetic:
      group: individual
      covariance: genetic
  residual:
    type: ar1
    group: unit
    position: time
    covariance: residual
    correlation: 0.25
analysis:
  task: rhe
  rhe:
    method: ordinary
    probes: 32
    seed: 4401
execution:
  solver: sparse_direct
  sparse_backend: pardiso
  threads: 4
output:
  directory: results/vc
  tables:
  - diagnostics
  predictions: {}
