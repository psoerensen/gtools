schema: gsuite.model/v1-draft
name: multitrait_packed_reml
traits:
- trait1
- trait2
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/2048-multitrait-packed-reml/data/phenotypes.csv
    id: record_id
    columns:
      individual: sample_id
      cohort: cohort
    responses:
      trait1: y1
      trait2: y2
  pedigree:
    type: pedigree
    file: ../frozen-inputs/rhe/cases/2048-multitrait-packed-reml/data/pedigree.csv
    columns:
      individual: sample_id
      parent1: parent1
      parent2: parent2
  genotypes:
    type: plink
    prefix: ../frozen-inputs/rhe/cases/2048-multitrait-packed-reml/data/genotypes
    id: IID
relationships:
  A:
    type: pedigree
    input: pedigree
  H:
    type: single_step
    pedigree: A
    genotypes: genotypes
    genomic:
      adjustment: none
      scale: 0.95
      polygenic_weight: 0.0
      independent_ridge: 1.0
covariances:
  genetic:
  - - 1.0
    - 0.2
  - - 0.2
    - 0.7
  residual:
  - - 2.0
    - 0.3
  - - 0.3
    - 1.5
model:
  data: observations
  fixed: '1'
  random:
    genetic:
      group: individual
      relationship: H
      covariance: genetic
  residual: residual
analysis:
  task: rhe
  rhe:
    method: ordinary
    probes: 32
    seed: 4401
execution:
  formulation: ss_snp
  solver: pcg
  sparse_backend: pardiso
  preconditioner: qnn_reuse
  pedigree_factorization: ancestral_sweeps
  threads: 4
  convergence:
    relative_tolerance: 1.0e-12
    absolute_tolerance: 1.0e-13
    maximum_iterations: 4000
output:
  directory: results/vc
  tables:
  - diagnostics
  predictions: {}
