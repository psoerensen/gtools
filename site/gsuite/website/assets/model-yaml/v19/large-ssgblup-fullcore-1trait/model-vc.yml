schema: gsuite.model/v1-draft
name: large_ssgblup_fullcore_1trait
traits:
- trait1
inputs:
  observations:
    type: table
    file: ../../data/large-single-step-1trait/phenotypes.csv
    format: csv
    id: record_id
    columns:
      individual: animal
    responses:
      trait1: trait1
  pedigree:
    type: pedigree
    file: ../../data/large-single-step-1trait/pedigree.csv
    columns:
      individual: animal
      parent1: sire
      parent2: dam
  genotypes:
    type: plink
    prefix: ../../data/large-single-step-1trait/genotypes
    id: IID
  core:
    type: table
    file: ../large-inputs/apy_core_all.csv
    columns:
      individual: animal
relationships:
  A:
    type: pedigree
    input: pedigree
  H:
    type: single_step
    pedigree: A
    genomic: G
  G:
    type: apy
    genotypes: genotypes
    core: core
    centering: sample_mean
    normalization: sum_2p1mp
    scale: 0.95
    offset: 0.0
    independent_ridge: 0.05
    minimum_conditional_variance: 0.0
    row_tile: 256
    marker_tile: 256
covariances:
  genetic:
  - - 0.4
  residual:
  - - 1.0
model:
  data: observations
  fixed: '1'
  random:
    genetic:
      group: individual
      relationship: H
      covariance: genetic
  residual: residual
analysis:
  task: rhe
  rhe:
    method: ordinary
    probes: 32
    seed: 4401
execution:
  formulation: ss_gblup
  solver: pcg
  sparse_backend: pardiso
  preconditioner: block_jacobi
  threads: 4
  convergence:
    relative_tolerance: 1.0e-08
    absolute_tolerance: 1.0e-10
    maximum_iterations: 4000
  relationship_metadata: prediction_only
output:
  directory: results/vc
  tables:
  - diagnostics
  predictions: {}
