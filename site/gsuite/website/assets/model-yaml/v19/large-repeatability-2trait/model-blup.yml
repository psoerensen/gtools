schema: gsuite.model/v1-draft
name: large_repeatability_2trait
traits:
- trait1
- trait2
inputs:
  observations:
    type: table
    file: ../../data/large-single-step-2trait/phenotypes.csv
    format: csv
    id: record_id
    columns:
      individual: animal
    responses:
      trait1: trait1
      trait2: trait2
  pedigree:
    type: pedigree
    file: ../../data/large-single-step-2trait/pedigree.csv
    columns:
      individual: animal
      parent1: sire
      parent2: dam
  genotypes:
    type: plink
    prefix: ../../data/large-single-step-2trait/genotypes
    id: IID
relationships:
  A:
    type: pedigree
    input: pedigree
  H:
    type: single_step
    pedigree: A
    genotypes: genotypes
    genomic:
      adjustment: pedigree_moments
      polygenic_weight: 0.25
      independent_ridge: 0.0
covariances:
  from_fit: results/vc/run.json
model:
  data: observations
  fixed: '1'
  random:
    genetic:
      group: individual
      relationship: H
      covariance: genetic
    permanent_environment:
      group: individual
      covariance: permanent_environment
  residual: residual
analysis:
  task: solve
execution:
  solver: pcg
  sparse_backend: pardiso
  threads: 4
  convergence:
    relative_tolerance: 1.0e-12
    absolute_tolerance: 1.0e-13
    maximum_iterations: 4000
  formulation: ss_snp
  preconditioner: qnn_reuse
  pedigree_factorization: ancestral_sweeps
  marker_cache: packed
  data_selection: all_records
output:
  directory: results/blup
  tables:
  - diagnostics
  predictions:
    genetic_values:
      effects:
      - genetic
      levels: all
evaluation:
  predictions: genetic_values
  truth:
    file: ../../data/large-single-step-2trait/true_breeding_values.csv
    columns:
      individual: animal
      trait: trait
      value: true_breeding_value
  subset: all
  individual: individual
  genotypes: genotypes
