schema: gsuite.model/v1-draft
name: multitrait_ssgblup_metafounders
traits:
- trait1
- trait2
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/2048-multitrait-ssgblup-metafounders/data/phenotypes.csv
    id: record_id
    columns:
      individual: sample_id
      cohort: cohort
      time: age_years
    responses:
      trait1: y1
      trait2: y2
  pedigree:
    type: pedigree
    file: ../frozen-inputs/rhe/cases/2048-multitrait-ssgblup-metafounders/data/pedigree.csv
    columns:
      individual: sample_id
      parent1: parent_1
      parent2: parent_2
  genomic_matrix:
    type: covariance
    file: ../frozen-inputs/rhe/cases/2048-multitrait-ssgblup-metafounders/data/genomic_matrix.csv
  base_assignments:
    type: table
    file: ../frozen-inputs/rhe/cases/2048-multitrait-ssgblup-metafounders/data/base_assignments.csv
    columns:
      individual: sample_id
      parent1_group: parent_1_group
      parent2_group: parent_2_group
  base_covariance:
    type: covariance
    file: ../frozen-inputs/rhe/cases/2048-multitrait-ssgblup-metafounders/data/base_covariance.csv
relationships:
  A:
    type: pedigree
    input: pedigree
    metafounders:
      covariance: base_covariance
      assignments: base_assignments
  G:
    type: covariance
    input: genomic_matrix
  H:
    type: single_step
    pedigree: A
    genomic: G
covariances:
  from_fit: results/vc/run.json
model:
  data: observations
  fixed: factor(cohort) + time
  random:
    genetic:
      group: individual
      relationship: H
      covariance: genetic
    individual_environment:
      group: individual
      covariance: individual_environment
  residual: residual
analysis:
  task: solve
execution:
  formulation: ss_gblup
  solver: pcg
  sparse_backend: pardiso
  preconditioner: block_jacobi
  convergence:
    relative_tolerance: 1.0e-11
    absolute_tolerance: 1.0e-13
    maximum_iterations: 4000
  threads: 4
output:
  directory: results/blup
  predictions:
    genetic_values:
      effects:
      - genetic
      levels: individuals
    base_and_individual_values:
      effects:
      - genetic
      levels: all
