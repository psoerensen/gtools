schema: gsuite.model/v1-draft
name: single_step_exponential
traits:
- trait1
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/2048-single-step-exponential/data/phenotypes.csv
    id: record_id
    columns:
      individual: sample_id
      time: position
    responses:
      trait1: response
  pedigree:
    type: pedigree
    file: ../frozen-inputs/rhe/cases/2048-single-step-exponential/data/pedigree.csv
    columns:
      individual: sample_id
      parent1: parent_1
      parent2: parent_2
  genotypes:
    type: plink
    prefix: ../frozen-inputs/rhe/cases/2048-single-step-exponential/data/genotypes
    id: IID
relationships:
  A:
    type: pedigree
    input: pedigree
  H:
    type: single_step
    pedigree: A
    genotypes: genotypes
    genomic:
      adjustment: none
      scale: 0.95
      polygenic_weight: 0.0
      independent_ridge: 0.05
covariances:
  from_fit: results/vc/run.json
model:
  data: observations
  fixed: 1 + time
  random:
    genetic:
      group: individual
      relationship: H
      covariance: genetic
    individual_environment:
      group: individual
      covariance: individual_environment
  residual:
    type: exponential
    group: individual
    position: time
    variance: 1.7
    rate: 0.7
analysis:
  task: solve
execution:
  formulation: ss_snp
  solver: pcg
  sparse_backend: pardiso
  preconditioner: qnn_reuse
  pedigree_factorization: ancestral_sweeps
  convergence:
    relative_tolerance: 1.0e-12
    absolute_tolerance: 1.0e-13
    maximum_iterations: 4000
  threads: 4
  data_selection: all_records
output:
  directory: results/blup
  predictions:
    genetic_values:
      effects:
      - genetic
      levels: individuals
