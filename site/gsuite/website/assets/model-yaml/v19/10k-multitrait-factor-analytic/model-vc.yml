schema: gsuite.model/v1-draft
name: multitrait_factor_analytic
traits:
- trait1
- trait2
- trait3
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/10k-multitrait-factor-analytic/data/phenotypes.csv
    id: record_id
    columns:
      individual: sample_id
      cohort: cohort
      age: age_years
    responses:
      trait1: y1
      trait2: y2
      trait3: y3
  pedigree:
    type: pedigree
    file: ../frozen-inputs/gsim/large-single-step-5trait/pedigree.csv
    columns:
      individual: animal
      parent1: sire
      parent2: dam
relationships:
  A:
    type: pedigree
    input: pedigree
covariances:
  genetic:
    type: factor_analytic
    rank: 1
    labels:
    - trait1
    - trait2
    - trait3
    factors:
    - shared
    loadings:
    - - 0.9
    - - 0.5
    - - -0.4
    specific_variances:
    - 0.6
    - 0.4
    - 0.7
  residual:
  - - 1.5
    - 0.1
    - 0.05
  - - 0.1
    - 1.2
    - -0.1
  - - 0.05
    - -0.1
    - 1.8
model:
  data: observations
  fixed: factor(cohort) + age
  random:
    genetic:
      group: individual
      relationship: A
      covariance: genetic
  residual: residual
analysis:
  task: rhe
  rhe:
    method: ordinary
    probes: 32
    seed: 4401
execution:
  solver: sparse_direct
  sparse_backend: pardiso
  threads: 4
output:
  directory: results/vc
  tables:
  - diagnostics
  predictions: {}
