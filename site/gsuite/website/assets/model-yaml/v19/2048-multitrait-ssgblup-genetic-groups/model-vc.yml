schema: gsuite.model/v1-draft
name: multitrait_ssgblup_genetic_groups
traits:
- trait1
- trait2
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/2048-multitrait-ssgblup-genetic-groups/data/phenotypes.csv
    id: record_id
    columns:
      individual: sample_id
      cohort: cohort
      time: age_years
    responses:
      trait1: y1
      trait2: y2
  pedigree:
    type: pedigree
    file: ../frozen-inputs/rhe/cases/2048-multitrait-ssgblup-genetic-groups/data/pedigree.csv
    columns:
      individual: sample_id
      parent1: parent_1
      parent2: parent_2
  core_matrix:
    type: covariance
    file: ../frozen-inputs/rhe/cases/2048-multitrait-ssgblup-genetic-groups/data/core_matrix.csv
  cross_matrix:
    type: covariance
    file: ../frozen-inputs/rhe/cases/2048-multitrait-ssgblup-genetic-groups/data/cross_matrix.csv
  diagonal:
    type: table
    file: ../frozen-inputs/rhe/cases/2048-multitrait-ssgblup-genetic-groups/data/diagonal.csv
    columns:
      individual: sample_id
      variance: genomic_variance
  group_assignments:
    type: table
    file: ../frozen-inputs/rhe/cases/2048-multitrait-ssgblup-genetic-groups/data/group_assignments.csv
    columns:
      individual: sample_id
      parent1_group: parent_1_group
      parent2_group: parent_2_group
relationships:
  A:
    type: pedigree
    input: pedigree
  G:
    type: apy
    core_covariance: core_matrix
    cross_covariance: cross_matrix
    noncore_diagonal: diagonal
    minimum_conditional_variance: 0.0
  H:
    type: single_step
    pedigree: A
    genomic: G
covariances:
  genetic:
  - - 1.0
    - 0.2
  - - 0.2
    - 0.7
  individual_environment:
  - - 0.4
    - 0.1
  - - 0.1
    - 0.6
  residual:
  - - 2.0
    - 0.3
  - - 0.3
    - 1.5
  group_mean:
  - - 0.8
    - 0.15
  - - 0.15
    - 0.5
model:
  data: observations
  fixed: factor(cohort) + time
  random:
    genetic:
      group: individual
      relationship: H
      covariance: genetic
    individual_environment:
      group: individual
      covariance: individual_environment
    ancestral_means:
      type: genetic_groups
      group: individual
      pedigree: A
      assignments: group_assignments
      groups:
      - G1
      - G2
      covariance: group_mean
  residual: residual
analysis:
  task: rhe
  rhe:
    method: ordinary
    probes: 32
    seed: 4401
execution:
  formulation: ss_gblup
  solver: pcg
  sparse_backend: pardiso
  preconditioner: block_jacobi
  convergence:
    relative_tolerance: 1.0e-11
    absolute_tolerance: 1.0e-13
    maximum_iterations: 4000
  threads: 4
output:
  directory: results/vc
  tables:
  - diagnostics
  predictions: {}
