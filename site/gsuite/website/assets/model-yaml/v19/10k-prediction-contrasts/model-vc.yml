schema: gsuite.model/v1-draft
name: prediction_contrasts
traits:
- trait1
- trait2
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/contrast-design/phenotypes.csv
    format: csv
    id: record_id
    columns:
      individual: animal
      cohort: cohort
      age: age
    responses:
      trait1: trait1
      trait2: trait2
  pedigree:
    type: pedigree
    file: ../frozen-inputs/gsim/large-pedigree-2trait/pedigree.csv
    columns:
      individual: animal
      parent1: sire
      parent2: dam
relationships:
  A:
    type: pedigree
    input: pedigree
covariances:
  genetic:
  - - 100.0
    - 12.0
  - - 12.0
    - 4.0
  residual:
  - - 150.0
    - 8.0
  - - 8.0
    - 6.0
model:
  data: observations
  fixed: factor(cohort) + age
  random:
    genetic:
      group: individual
      relationship: A
      covariance: genetic
  residual: residual
analysis:
  task: rhe
  rhe:
    method: ordinary
    probes: 32
    seed: 4401
execution:
  solver: sparse_direct
  sparse_backend: pardiso
  threads: 4
output:
  directory: results/vc
  tables:
  - diagnostics
  predictions: {}
