schema: gsuite.model/v1-draft
name: multitrait_metafounders
traits:
- trait1
- trait2
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/2048-multitrait-metafounders/data/phenotypes.csv
    format: csv
    id: record_id
    columns:
      individual: sample_id
      cohort: cohort
      age: age_years
    responses:
      trait1: height_cm
      trait2: bmi
  pedigree:
    type: pedigree
    file: ../frozen-inputs/rhe/cases/2048-multitrait-metafounders/data/pedigree.csv
    columns:
      individual: sample_id
      parent1: parent_1
      parent2: parent_2
  base_assignments:
    type: table
    file: ../frozen-inputs/rhe/cases/2048-multitrait-metafounders/data/base_assignments.csv
    columns:
      individual: sample_id
      parent1_group: parent_1_group
      parent2_group: parent_2_group
  base_covariance:
    type: covariance
    file: ../frozen-inputs/rhe/cases/2048-multitrait-metafounders/data/base_covariance.csv
relationships:
  A:
    type: pedigree
    input: pedigree
    metafounders:
      covariance: base_covariance
      assignments: base_assignments
covariances:
  genetic:
  - - 100.0
    - 12.0
  - - 12.0
    - 4.0
  residual:
  - - 150.0
    - 8.0
  - - 8.0
    - 6.0
model:
  data: observations
  fixed: factor(cohort) + age
  random:
    genetic:
      group: individual
      relationship: A
      covariance: genetic
  residual: residual
analysis:
  task: rhe
  rhe:
    method: ordinary
    probes: 32
    seed: 4401
execution:
  solver: sparse_direct
  sparse_backend: pardiso
  threads: 4
output:
  directory: results/vc
  tables:
  - diagnostics
  predictions: {}
