schema: gsuite.model/v1-draft
name: multitrait_ssgblup
traits:
- trait1
- trait2
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/10k-multitrait-ssgblup/data/phenotypes.csv
    id: record_id
    columns:
      individual: sample_id
      cohort: cohort
      time: age_years
    responses:
      trait1: y1
      trait2: y2
  pedigree:
    type: pedigree
    file: ../frozen-inputs/gsim/large-single-step-5trait/pedigree.csv
    columns:
      individual: animal
      parent1: sire
      parent2: dam
  genomic_matrix:
    type: covariance
    file: ../frozen-inputs/rhe/cases/10k-multitrait-ssgblup/data/G.csv
relationships:
  A:
    type: pedigree
    input: pedigree
  G:
    type: covariance
    input: genomic_matrix
  H:
    type: single_step
    pedigree: A
    genomic: G
covariances:
  genetic:
  - - 1.0
    - 0.2
  - - 0.2
    - 0.7
  individual_environment:
  - - 0.4
    - 0.1
  - - 0.1
    - 0.6
  residual:
  - - 2.0
    - 0.3
  - - 0.3
    - 1.5
model:
  data: observations
  fixed: factor(cohort) + time
  random:
    genetic:
      group: individual
      relationship: H
      covariance: genetic
    individual_environment:
      group: individual
      covariance: individual_environment
  residual: residual
analysis:
  task: rhe
  rhe:
    method: ordinary
    probes: 32
    seed: 4401
execution:
  formulation: ss_gblup
  solver: pcg
  sparse_backend: pardiso
  preconditioner: block_jacobi
  convergence:
    relative_tolerance: 1.0e-11
    absolute_tolerance: 1.0e-13
    maximum_iterations: 4000
  threads: 4
output:
  directory: results/vc
  tables:
  - diagnostics
  predictions: {}
