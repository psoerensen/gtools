schema: gsuite.model/v1-draft
name: multitrait_fixed_genetic_groups
traits:
- trait1
- trait2
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/2048-multitrait-fixed-genetic-groups/data/phenotypes.csv
    format: csv
    id: record_id
    columns:
      individual: sample_id
      cohort: cohort
      age: age_years
    responses:
      trait1: height_cm
      trait2: bmi
  pedigree:
    type: pedigree
    file: ../frozen-inputs/rhe/cases/2048-multitrait-fixed-genetic-groups/data/pedigree.csv
    columns:
      individual: sample_id
      parent1: parent_1
      parent2: parent_2
  group_assignments:
    type: table
    file: ../frozen-inputs/rhe/cases/2048-multitrait-fixed-genetic-groups/data/group_assignments.csv
    columns:
      individual: sample_id
      parent1_group: parent_1_group
      parent2_group: parent_2_group
relationships:
  A:
    type: pedigree
    input: pedigree
covariances:
  genetic:
  - - 100.0
    - 12.0
  - - 12.0
    - 4.0
  residual:
  - - 150.0
    - 8.0
  - - 8.0
    - 6.0
model:
  data: observations
  fixed: factor(cohort)
  random:
    genetic:
      group: individual
      relationship: A
      covariance: genetic
    ancestral_means:
      type: genetic_groups
      group: individual
      pedigree: A
      assignments: group_assignments
      groups:
      - G1
      - G2
      mode: fixed
      reference: G1
  residual: residual
analysis:
  task: rhe
  rhe:
    method: ordinary
    probes: 32
    seed: 4401
execution:
  solver: sparse_direct
  sparse_backend: pardiso
  threads: 4
output:
  directory: results/vc
  tables:
  - diagnostics
  predictions: {}
