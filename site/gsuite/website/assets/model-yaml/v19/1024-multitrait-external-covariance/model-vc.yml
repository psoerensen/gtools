schema: gsuite.model/v1-draft
name: multitrait_external_covariance
traits:
- trait1
- trait2
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/1024-multitrait-external-covariance/data/phenotypes.csv
    id: record_id
    columns:
      individual: sample_id
      cohort: cohort
      time: age_years
      site: site_id
    responses:
      trait1: y1
      trait2: y2
  relationship_matrix:
    type: covariance
    file: ../frozen-inputs/rhe/cases/1024-multitrait-external-covariance/data/G.csv
relationships:
  K:
    type: covariance
    input: relationship_matrix
covariances:
  genetic:
  - - 1.0
    - 0.2
  - - 0.2
    - 0.7
  residual_S1:
  - - 2.0
    - 0.3
  - - 0.3
    - 1.5
  residual_S2:
  - - 0.8
    - -0.1
  - - -0.1
    - 2.3
model:
  data: observations
  fixed: factor(cohort) * time
  random:
    genetic:
      group: individual
      relationship: K
      covariance: genetic
  residual:
    type: grouped
    group: site
    covariances:
      S1: residual_S1
      S2: residual_S2
analysis:
  task: rhe
  rhe:
    method: ordinary
    probes: 32
    seed: 4401
execution:
  solver: sparse_direct
  sparse_backend: pardiso
  threads: 4
output:
  directory: results/vc
  tables:
  - diagnostics
  predictions: {}
