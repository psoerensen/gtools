schema: gsuite.model/v1-draft
name: multitrait_longitudinal_exponential
traits:
- trait1
- trait2
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/2048-multitrait-longitudinal-exponential/data/phenotypes.csv
    id: record_id
    columns:
      individual: sample_id
      time: position
    responses:
      trait1: response1
      trait2: response2
  pedigree:
    type: pedigree
    file: ../frozen-inputs/rhe/cases/2048-multitrait-longitudinal-exponential/data/pedigree.csv
    columns:
      individual: sample_id
      parent1: parent_1
      parent2: parent_2
relationships:
  A:
    type: pedigree
    input: pedigree
covariances:
  from_fit: results/vc/run.json
model:
  data: observations
  fixed: 1 + time
  random:
    genetic:
      group: individual
      relationship: A
      covariance: genetic
    environment:
      group: individual
      covariance: environment
  residual:
    type: exponential
    group: individual
    position: time
    covariance: residual
    rate: 0.7
analysis:
  task: solve
execution:
  solver: sparse_direct
  sparse_backend: pardiso
  threads: 4
output:
  directory: results/blup
  predictions:
    genetic_values:
      effects:
      - genetic
      levels: all
    record_values:
      effects:
      - genetic
      data: observations
