schema: gsuite.model/v1-draft
name: reproducible_smoke
traits:
- trait1
- trait2
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/2048-smoke/data/phenotypes.csv
    format: csv
    id: record_id
    columns:
      individual: animal
    responses:
      trait1: trait1
      trait2: trait2
  pedigree:
    type: pedigree
    file: ../frozen-inputs/rhe/cases/2048-smoke/data/pedigree.csv
    columns:
      individual: animal
      parent1: sire
      parent2: dam
  genotypes:
    type: plink
    prefix: ../frozen-inputs/rhe/cases/2048-smoke/data/genotypes
    id: IID
relationships:
  A:
    type: pedigree
    input: pedigree
  H:
    type: single_step
    pedigree: A
    genotypes: genotypes
    genomic:
      adjustment: pedigree_moments
      polygenic_weight: 0.05
      independent_ridge: 0.0
covariances:
  genetic:
  - - 0.4
    - 0.1
  - - 0.1
    - 0.3
  residual:
  - - 1.0
    - 0.2
  - - 0.2
    - 0.8
model:
  data: observations
  fixed: '1'
  random:
    genetic:
      group: individual
      relationship: H
      covariance: genetic
  residual: residual
analysis:
  task: rhe
  rhe:
    method: ordinary
    probes: 32
    seed: 4401
execution:
  formulation: ss_snp
  solver: pcg
  sparse_backend: pardiso
  preconditioner: qnn_reuse
  pedigree_factorization: ancestral_sweeps
  marker_cache: packed
  budgets:
    budget_bytes: 67108864
  threads: 4
  convergence:
    relative_tolerance: 1.0e-12
    absolute_tolerance: 1.0e-13
    maximum_iterations: 4000
output:
  directory: results/vc
  tables:
  - diagnostics
  predictions: {}
