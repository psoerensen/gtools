schema: gsuite.model/v1-draft
name: hybrid_gca_sca
traits:
- yield
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/576-hybrid-gca-sca/data/phenotypes.csv
    id: record
    columns:
      cross: hybrid
      parent1: parent_one
      parent2: parent_two
    responses:
      yield: value
  crosses:
    type: table
    file: ../frozen-inputs/rhe/cases/576-hybrid-gca-sca/data/crosses.csv
    id: hybrid
    columns:
      parent1: parent_one
      parent2: parent_two
  pool1:
    type: covariance
    file: ../frozen-inputs/rhe/cases/576-hybrid-gca-sca/data/pool1.csv
  pool2:
    type: covariance
    file: ../frozen-inputs/rhe/cases/576-hybrid-gca-sca/data/pool2.csv
relationships:
  A1:
    type: covariance
    input: pool1
  A2:
    type: covariance
    input: pool2
  S:
    type: cross_product
    parent1: A1
    parent2: A2
    crosses: crosses
covariances:
  from_fit: results/vc/run.json
model:
  data: observations
  fixed: '1'
  random:
    gca1:
      group: parent1
      relationship: A1
      covariance: gca1
    gca2:
      group: parent2
      relationship: A2
      covariance: gca2
    sca:
      group: cross
      relationship: S
      covariance: sca
  residual: residual
analysis:
  task: solve
execution:
  solver: sparse_direct
  sparse_backend: pardiso
  threads: 4
output:
  directory: results/blup
  predictions:
    hybrid_values:
      effects:
      - gca1
      - gca2
      - sca
      data: observations
  uncertainty:
    method: exact
    maximum_solves: 1
    contrasts:
      hybrid_c22:
      - prediction: hybrid_values
        record: r0_0
        trait: yield
        weight: 1.0
