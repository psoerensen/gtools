model:
  data: records
  fixed: 1 + fA + fB
  random:
    genetic:
      type: ancestry
      mode: ANCESTRY_UNCOR
      group: individual
      pedigree: A
      ancestry: phase
      genomic_residual:
        diagonal: 0.12
      components:
        first:
          markers:
          - m0
          - m1
          - m2
          covariance: S1
        second:
          markers:
          - m3
          - m4
          - m5
          covariance: S2
      partial_pedigree:
        founders: ../frozen-inputs/rhe/cases/120-boa-partial-lbp-reml/design/founders.csv
        covariances:
          breedA: KA
          breedB: KB
          breedC: KC
      lap:
        reference_ancestry: breedC
        covariance: OmegaLBP
    pe:
      group: individual
      covariance: PE
  residual: R
analysis:
  task: rhe
  rhe:
    method: ordinary
    probes: 32
    seed: 4401
execution:
  formulation: ss_snp_ancestry
  solver: pcg
  sparse_backend: pardiso
  preconditioner: qnn_reuse
  threads: 4
output:
  directory: results/vc
  tables:
  - diagnostics
  predictions: {}
