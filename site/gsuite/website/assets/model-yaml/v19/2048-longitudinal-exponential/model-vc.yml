schema: gsuite.model/v1-draft
name: longitudinal_exponential
traits:
- trait1
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/2048-longitudinal-exponential/data/phenotypes.csv
    id: record_id
    columns:
      individual: sample_id
      time: position
    responses:
      trait1: response
  pedigree:
    type: pedigree
    file: ../frozen-inputs/rhe/cases/2048-longitudinal-exponential/data/pedigree.csv
    columns:
      individual: sample_id
      parent1: parent_1
      parent2: parent_2
relationships:
  A:
    type: pedigree
    input: pedigree
covariances:
  genetic:
  - - 1.0
  individual_environment:
  - - 0.4
model:
  data: observations
  fixed: 1 + time
  random:
    genetic:
      group: individual
      relationship: A
      covariance: genetic
    individual_environment:
      group: individual
      covariance: individual_environment
  residual:
    type: exponential
    group: individual
    position: time
    variance: 1.7
    rate: 0.7
analysis:
  task: rhe
  rhe:
    method: ordinary
    probes: 32
    seed: 4401
execution:
  solver: sparse_direct
  sparse_backend: pardiso
  threads: 4
output:
  directory: results/vc
  tables:
  - diagnostics
  predictions: {}
