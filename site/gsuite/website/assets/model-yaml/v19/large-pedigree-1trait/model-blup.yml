schema: gsuite.model/v1-draft
name: large_pedigree_1trait
traits:
- trait1
inputs:
  observations:
    type: table
    file: ../../data/large-pedigree-1trait/phenotypes.csv
    format: csv
    id: record_id
    columns:
      individual: animal
    responses:
      trait1: trait1
  pedigree:
    type: pedigree
    file: ../../data/large-pedigree-1trait/pedigree.csv
    columns:
      individual: animal
      parent1: sire
      parent2: dam
relationships:
  A:
    type: pedigree
    input: pedigree
covariances:
  from_fit: results/vc/run.json
model:
  data: observations
  fixed: '1'
  random:
    genetic:
      group: individual
      relationship: A
      covariance: genetic
  residual: residual
analysis:
  task: solve
evaluation:
  predictions: genetic_values
  truth:
    file: ../../data/large-pedigree-1trait/true_breeding_values.csv
    columns:
      individual: animal
      trait: trait
      value: true_breeding_value
  subset: all
  individual: individual
execution:
  solver: pcg
  sparse_backend: pardiso
  threads: 4
  convergence:
    relative_tolerance: 1.0e-08
    absolute_tolerance: 1.0e-10
    maximum_iterations: 4000
  preconditioner: block_jacobi
output:
  directory: results/blup
  tables:
  - diagnostics
  predictions:
    genetic_values:
      effects:
      - genetic
      levels: all
