schema: gsuite.model/v1-draft
traits:
- trait1
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/2048-reml-random-intercept/data/phenotypes.csv
    id: record_id
    columns:
      individual: sample_id
    responses:
      trait1: response
covariances:
  genetic:
  - - 2.0
  residual:
  - - 2.0
model:
  data: observations
  fixed: '1'
  random:
    genetic:
      group: individual
      covariance: genetic
  residual: residual
analysis:
  task: rhe
  rhe:
    method: ordinary
    probes: 32
    seed: 4401
execution:
  solver: sparse_direct
  sparse_backend: pardiso
  threads: 4
output:
  directory: results/vc
  tables:
  - diagnostics
  predictions: {}
name: reml_random_intercept
