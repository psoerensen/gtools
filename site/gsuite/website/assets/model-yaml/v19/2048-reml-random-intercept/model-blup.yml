schema: gsuite.model/v1-draft
traits:
- trait1
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/2048-reml-random-intercept/data/phenotypes.csv
    id: record_id
    columns:
      individual: sample_id
    responses:
      trait1: response
covariances:
  from_fit: results/vc/run.json
model:
  data: observations
  fixed: '1'
  random:
    genetic:
      group: individual
      covariance: genetic
  residual: residual
analysis:
  task: solve
execution:
  solver: sparse_direct
  sparse_backend: pardiso
  threads: 4
output:
  directory: results/blup
  predictions:
    genetic_values:
      effects:
      - genetic
      levels: all
name: reml_random_intercept
