schema: gsuite.model/v1-draft
name: direct_maternal_single_step
traits:
- weight
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/10k-direct-maternal-single-step/data/phenotypes.csv
    id: record_id
    columns:
      individual: sample_id
      mother: mother_id
      cohort: cohort
    responses:
      weight: weight
  pedigree:
    type: pedigree
    file: ../frozen-inputs/gsim/large-single-step-5trait/pedigree.csv
    columns:
      individual: animal
      parent1: sire
      parent2: dam
  genotypes:
    type: plink
    prefix: ../frozen-inputs/gsim/large-single-step-5trait/genotypes
    id: IID
relationships:
  A:
    type: pedigree
    input: pedigree
  H:
    type: single_step
    pedigree: A
    genotypes: genotypes
    genomic:
      adjustment: none
      scale: 0.95
      polygenic_weight: 0.0
      independent_ridge: 0.05
covariances:
  from_fit: results/vc/run.json
model:
  data: observations
  fixed: factor(cohort)
  random:
    genetic:
      group: individual
      relationship: H
      channels:
      - name: direct
        trait: weight
      - name: maternal
        trait: weight
        group: mother
      covariance: genetic
    maternal_environment:
      group: mother
      covariance: maternal_environment
  residual: residual
analysis:
  task: solve
execution:
  formulation: ss_snp
  solver: pcg
  sparse_backend: pardiso
  preconditioner: qnn_reuse
  pedigree_factorization: ancestral_sweeps
  convergence:
    relative_tolerance: 1.0e-12
    absolute_tolerance: 1.0e-13
    maximum_iterations: 4000
  threads: 4
  data_selection: all_records
output:
  directory: results/blup
  predictions:
    direct_genetic_values:
      effects:
      - genetic
      channels:
      - direct
      levels: individuals
    maternal_genetic_values:
      effects:
      - genetic
      channels:
      - maternal
      levels: individuals
    genetic_record_contributions:
      effects:
      - genetic
      data: observations
    random_record_contributions:
      effects:
      - genetic
      - maternal_environment
      data: observations
