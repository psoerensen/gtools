schema: gsuite.model/v1-draft
name: multitrait_ssgblup_apy_plink
traits:
- trait1
- trait2
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/10k-multitrait-ssgblup-apy-plink/data/phenotypes.csv
    id: record_id
    columns:
      individual: sample_id
      cohort: cohort
      time: age_years
    responses:
      trait1: y1
      trait2: y2
  pedigree:
    type: pedigree
    file: ../frozen-inputs/gsim/large-single-step-5trait/pedigree.csv
    columns:
      individual: animal
      parent1: sire
      parent2: dam
  genotypes:
    type: plink
    prefix: ../frozen-inputs/gsim/large-single-step-5trait/genotypes
    id: IID
  core:
    type: table
    file: ../frozen-inputs/rhe/cases/10k-multitrait-ssgblup-apy-plink/data/core_ids.csv
    columns:
      individual: sample_id
relationships:
  A:
    type: pedigree
    input: pedigree
  G:
    type: apy
    genotypes: genotypes
    core: core
    centering: sample_mean
    normalization: sum_2p1mp
    scale: 0.95
    offset: 0.0
    independent_ridge: 0.05
    minimum_conditional_variance: 0.0
    row_tile: 256
    marker_tile: 256
  H:
    type: single_step
    pedigree: A
    genomic: G
covariances:
  from_fit: results/vc/run.json
model:
  data: observations
  fixed: factor(cohort) + time
  random:
    genetic:
      group: individual
      relationship: H
      covariance: genetic
    individual_environment:
      group: individual
      covariance: individual_environment
  residual: residual
analysis:
  task: solve
execution:
  formulation: ss_gblup
  solver: pcg
  sparse_backend: pardiso
  preconditioner: block_jacobi
  relationship_metadata: prediction_only
  convergence:
    relative_tolerance: 1.0e-11
    maximum_iterations: 4000
  threads: 4
output:
  directory: results/blup
  predictions:
    genetic_values:
      effects:
      - genetic
      levels: all
