schema: gsuite.model/v1-draft
name: large_random_intercept_reml
traits:
- trait1
inputs:
  observations:
    type: table
    file: ../../data/large-pedigree-1trait/phenotypes.csv
    format: csv
    id: record_id
    columns:
      individual: animal
    responses:
      trait1: trait1
covariances:
  genetic:
  - - 0.4
  residual:
  - - 1.0
model:
  data: observations
  fixed: '1'
  random:
    genetic:
      group: individual
      covariance: genetic
  residual: residual
analysis:
  task: rhe
  rhe:
    method: ordinary
    probes: 32
    seed: 4401
execution:
  solver: sparse_direct
  sparse_backend: pardiso
  threads: 4
output:
  directory: results/vc
  tables:
  - diagnostics
  predictions: {}
