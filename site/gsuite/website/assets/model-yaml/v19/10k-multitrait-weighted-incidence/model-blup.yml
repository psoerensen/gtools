schema: gsuite.model/v1-draft
name: multitrait_weighted_incidence
traits:
- trait1
- trait2
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/10k-multitrait-weighted-incidence/data/phenotypes.csv
    format: csv
    id: record_id
    columns:
      individual: sample_id
      cohort: cohort
      age: age_years
      contributor: contributor_id
      contribution: contribution
    responses:
      trait1: height_cm
      trait2: bmi
  pedigree:
    type: pedigree
    file: ../frozen-inputs/gsim/large-single-step-5trait/pedigree.csv
    columns:
      individual: animal
      parent1: sire
      parent2: dam
relationships:
  A:
    type: pedigree
    input: pedigree
covariances:
  from_fit: results/vc/run.json
model:
  data: observations
  fixed: factor(cohort) + age
  random:
    genetic:
      group: individual
      relationship: A
      covariance: genetic
      incidence:
      - individual: individual
        weight: 0.6
      - individual: contributor
        weight: contribution
  residual: residual
analysis:
  task: solve
execution:
  solver: sparse_direct
  sparse_backend: pardiso
  threads: 4
output:
  directory: results/blup
  predictions:
    genetic_values:
      effects:
      - genetic
      levels: all
    observation_genetic_values:
      effects:
      - genetic
      data: observations
