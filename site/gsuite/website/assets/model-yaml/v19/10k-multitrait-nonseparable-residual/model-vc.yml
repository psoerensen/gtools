schema: gsuite.model/v1-draft
name: multitrait_nonseparable_residual
traits:
- trait1
- trait2
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/10k-multitrait-nonseparable-residual/data/phenotypes.csv
    format: csv
    id: record_id
    columns:
      individual: sample_id
      cohort: cohort
      age: age_years
      time: age_years
    responses:
      trait1: height_cm
      trait2: bmi
  pedigree:
    type: pedigree
    file: ../frozen-inputs/gsim/large-single-step-5trait/pedigree.csv
    columns:
      individual: animal
      parent1: sire
      parent2: dam
relationships:
  A:
    type: pedigree
    input: pedigree
covariances:
  genetic:
  - - 100.0
    - 12.0
  - - 12.0
    - 4.0
  residual:
  - - 1.2
    - 0.0
    - 0.24
    - -0.18
    - 0.0
    - 0.0
  - - 0.0
    - 2.0
    - 0.0
    - 0.0
    - 0.5
    - 0.0
  - - 0.24
    - 0.0
    - 1.748
    - -0.036
    - 0.0
    - 0.51
  - - -0.18
    - 0.0
    - -0.036
    - 0.927
    - 0.0
    - 0.0
  - - 0.0
    - 0.5
    - 0.0
    - 0.0
    - 2.525
    - 0.0
  - - 0.0
    - 0.0
    - 0.51
    - 0.0
    - 0.0
    - 1.2530000000000001
model:
  data: observations
  fixed: factor(cohort) + age
  random:
    genetic:
      group: individual
      relationship: A
      covariance: genetic
  residual:
    type: supplied_blocks
    group: individual
    position: time
    coordinates:
    - trait: trait1
      position: 20
    - trait: trait2
      position: 20
    - trait: trait1
      position: 21
    - trait: trait2
      position: 21
    - trait: trait1
      position: 22
    - trait: trait2
      position: 22
    covariance: residual
analysis:
  task: rhe
  rhe:
    method: ordinary
    probes: 32
    seed: 4401
execution:
  solver: sparse_direct
  sparse_backend: pardiso
  threads: 4
output:
  directory: results/vc
  tables:
  - diagnostics
  predictions: {}
