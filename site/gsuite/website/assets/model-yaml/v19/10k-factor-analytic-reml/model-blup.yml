schema: gsuite.model/v1-draft
name: factor_analytic_reml
traits:
- trait1
- trait2
- trait3
inputs:
  observations:
    type: table
    file: ../frozen-inputs/rhe/cases/10k-factor-analytic-reml/data/phenotypes.csv
    id: record_id
    columns:
      individual: sample_id
    responses:
      trait1: v0
      trait2: v1
      trait3: v2
covariances:
  from_fit: results/vc/run.json
model:
  data: observations
  fixed: '1'
  random:
    genetic:
      group: individual
      covariance: genetic
  residual: residual
analysis:
  task: solve
execution:
  solver: sparse_direct
  sparse_backend: pardiso
  threads: 4
output:
  directory: results/blup
  predictions:
    genetic_values:
      effects:
      - genetic
      levels: all
